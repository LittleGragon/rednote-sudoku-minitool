<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sudoku Matrix · 每日益智</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">

    <!-- ================= 顶部导航栏 ================= -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-block">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 100 100" width="32" height="32">
              <defs>
                <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#667EEA"></stop>
                  <stop offset="100%" stop-color="#764BA2"></stop>
                </linearGradient>
              </defs>
              <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#logo-grad)"></rect>
              <rect x="22" y="22" width="16" height="16" rx="4" fill="#ffffff"></rect>
              <rect x="42" y="22" width="16" height="16" rx="4" fill="rgba(255,255,255,0.4)"></rect>
              <rect x="62" y="22" width="16" height="16" rx="4" fill="#ffffff"></rect>
              <rect x="22" y="42" width="16" height="16" rx="4" fill="rgba(255,255,255,0.3)"></rect>
              <rect x="42" y="42" width="16" height="16" rx="4" fill="#ffffff"></rect>
              <rect x="62" y="42" width="16" height="16" rx="4" fill="rgba(255,255,255,0.5)"></rect>
              <rect x="22" y="62" width="16" height="16" rx="4" fill="#ffffff"></rect>
              <rect x="42" y="62" width="16" height="16" rx="4" fill="rgba(255,255,255,0.6)"></rect>
              <rect x="62" y="62" width="16" height="16" rx="4" fill="#ffffff"></rect>
            </svg>
          </span>
          <div class="brand-text">
            <span class="brand-title">Sudoku Matrix</span>
            <span class="brand-subtitle">数独大师 Pro · 无压心流模式</span>
          </div>
        </div>
        <!-- 右侧为小红书平台按钮（分享/关闭）系统区，保持留白 -->
        <div class="platform-safe-area" aria-hidden="true"></div>
      </div>
    </header>

    <main class="app-main">

      <!-- ================= 首页：难度选择 ================= -->
      <section class="view view-home" id="view-home">
        <div class="home-hero">
          <h1 class="home-title">开始一局数独</h1>
          <p class="home-desc">选择难度，每题均保证唯一解</p>
        </div>
        <div class="difficulty-list" id="difficulty-list"></div>
        <button class="btn-start" type="button" data-action="start-game">
          <span class="btn-start-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"></path></svg>
          </span>
          开始游戏
        </button>
      </section>

      <!-- ================= 游戏页 ================= -->
      <section class="view view-game" id="view-game" hidden>

        <!-- 状态栏：难度 / 计时 / 心流禅模式（右侧为平台胶囊安全区，保持留白） -->
        <section class="status-ribbon">
          <div class="difficulty-pill">
            <span class="difficulty-dot" aria-hidden="true"></span>
            <span id="difficulty-label">中等难度</span>
          </div>
          <div class="timer-pill">
            <span class="icon-15" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9.5V13l2.5 1.8M9.5 2h5"></path></svg>
            </span>
            <span class="timer-value" id="game-timer">00:00</span>
          </div>
          <div class="zen-pill">
            <span class="icon-15" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-7 4-12 9-14-1 8-4 12-9 14zM12 21c0-6-3-10-8-12 1 7 3 10 8 12z"></path></svg>
            </span>
            <span id="zen-label">心流禅模式</span>
          </div>
          <div class="ribbon-buffer" aria-hidden="true"></div>
        </section>

        <!-- 9x9 棋盘 -->
        <div class="board-wrap">
          <div class="board-card">
            <div class="board-grid" id="board-grid"></div>
          </div>
        </div>

        <!-- 中部操作胶囊栏：新游戏 / 主题切换 / 返回首页 -->
        <section class="mid-ribbon">
          <button class="capsule-btn" type="button" data-action="restart-game" aria-label="新游戏">
            <span class="capsule-icon capsule-icon-primary" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"></path></svg>
            </span>
            <span>新游戏</span>
          </button>
          <button class="capsule-btn" type="button" data-action="toggle-theme" aria-label="日夜主题切换">
            <span class="capsule-icon capsule-icon-secondary" id="theme-icon" aria-hidden="true">
              <svg class="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"></path></svg>
              <svg class="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"></path></svg>
            </span>
            <span id="theme-label">日间</span>
          </button>
          <button class="capsule-btn" type="button" data-action="back-home" aria-label="返回首页">
            <span class="capsule-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 3.5 20.5 11M6 9.5V20h12V9.5"></path></svg>
            </span>
            <span>返回首页</span>
          </button>
        </section>

        <!-- 底部区：3x3 数字键盘 + 右侧竖排操作按钮（标记 / 擦除 / 检查） -->
        <section class="game-bottom">
          <div class="numpad" id="numpad"></div>
          <div class="side-toolbar">
            <button class="side-btn side-btn-note" type="button" id="note-btn" data-action="toggle-note" aria-label="笔记候选数模式">
              <span class="note-dot" id="note-dot" aria-hidden="true"></span>
              <span class="side-btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1zM14 7l3 3"></path></svg>
              </span>
              <span class="side-btn-label">标记</span>
            </button>
            <button class="side-btn" type="button" data-action="erase" aria-label="擦除">
              <span class="side-btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 3.5 6 6L10 20H4.5l-1-1 11-15.5zM8 20h12"></path></svg>
              </span>
              <span class="side-btn-label">擦除</span>
            </button>
            <button class="side-btn" type="button" data-action="check-board" aria-label="检查全盘">
              <span class="side-btn-icon side-btn-icon-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12.5 2.8 2.8L16.5 9"></path></svg>
              </span>
              <span class="side-btn-label">检查</span>
            </button>
          </div>
        </section>
      </section>
    </main>

    <!-- ================= 完成结算弹窗 ================= -->
    <div class="modal-mask" id="win-modal" hidden>
      <div class="win-card">
        <div class="win-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17.5V21M7 3.5h10V9a5 5 0 0 1-10 0V3.5zM7 5H4v1.5A3.5 3.5 0 0 0 7 10M17 5h3v1.5a3.5 3.5 0 0 1-3 3.5"></path></svg>
        </div>
        <h2 class="win-title">恭喜通关！</h2>
        <div class="win-subpill">
          <span class="win-sub-dot" aria-hidden="true"></span>
          <span id="win-subtitle">中等难度 · 纯净通关</span>
        </div>
        <div class="win-stats">
          <!-- 最终用时 -->
          <div class="win-stat">
            <div class="win-stat-head">
              <span class="win-stat-name">最终用时</span>
              <span class="win-stat-icon win-stat-icon-primary" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9.5V13l2.5 1.8M9.5 2h5"></path></svg>
              </span>
            </div>
            <div class="win-stat-value" id="stat-time">00:00</div>
            <div class="win-stat-tag win-tag-best" id="stat-best-tag" hidden>
              <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-7M14 8h6v6"></path></svg>
              <span>历史最佳</span>
            </div>
          </div>
          <!-- 推导步数 -->
          <div class="win-stat">
            <div class="win-stat-head">
              <span class="win-stat-name">推导步数</span>
              <span class="win-stat-icon win-stat-icon-secondary" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><path d="M8.5 18H12a4 4 0 0 0 4-4V8.5"></path></svg>
              </span>
            </div>
            <div class="win-stat-value"><span id="stat-steps">0</span><span class="win-stat-unit">步</span></div>
            <div class="win-stat-note" id="stat-mistakes-note">失误 0 次</div>
          </div>
          <!-- 笔记使用 -->
          <div class="win-stat">
            <div class="win-stat-head">
              <span class="win-stat-name">笔记使用</span>
              <span class="win-stat-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L13 4l3 3-8 12-4 1zM12 5l3 3M14 20h6M14 16h6"></path></svg>
              </span>
            </div>
            <div class="win-stat-value"><span id="stat-notes">0</span><span class="win-stat-unit">次</span></div>
            <div class="win-stat-note" id="stat-note-rate">辅助标记率 0%</div>
          </div>
          <!-- 通关评级 -->
          <div class="win-stat">
            <div class="win-stat-head">
              <span class="win-stat-name">通关评级</span>
              <span class="win-stat-icon win-stat-icon-tertiary" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17.5V21M7 3.5h10V9a5 5 0 0 1-10 0V3.5zM7 5H4v1.5A3.5 3.5 0 0 0 7 10M17 5h3v1.5a3.5 3.5 0 0 1-3 3.5"></path></svg>
              </span>
            </div>
            <div class="win-stat-value win-grade-value"><span id="stat-grade">S</span><span class="win-stat-unit">级</span></div>
            <div class="win-stat-tag win-tag-perfect" id="stat-perfect-tag" hidden>零失误达成</div>
          </div>
        </div>
        <div class="win-actions">
          <button class="btn-win-primary" type="button" data-action="win-next-round">
            <span>再来一局</span>
            <span class="btn-win-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
            </span>
          </button>
          <button class="btn-win-secondary" type="button" data-action="win-back-home">
            <span class="btn-win-home-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 3.5 20.5 11M6 9.5V20h12V9.5"></path></svg>
            </span>
            <span>返回首页</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ================= 检查提示 Toast ================= -->
    <div class="toast" id="check-toast" hidden></div>

  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
